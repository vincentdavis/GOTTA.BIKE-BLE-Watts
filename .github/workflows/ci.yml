# Checks every push to main and every pull request: formatting, analyzer,
# tests, a release-mode APK build, and the analysis script's self-test.
# The APK here is signed with a throwaway debug key, so it is for quick
# testing only; signed releases come from release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with the Flutter used for local builds (`flutter --version`).
  FLUTTER_VERSION: "3.44.7"

jobs:
  flutter:
    name: Analyze, test, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - run: flutter analyze

      - run: flutter test

      - name: Build APK (debug-signed, for testing only)
        run: flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: apk-debug-signed-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  analysis:
    name: Analysis self-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: analysis/requirements.txt

      - run: pip install -r analysis/requirements.txt

      - run: python fit_cda.py --self-test
        working-directory: analysis
